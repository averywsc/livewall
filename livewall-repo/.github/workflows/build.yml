name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Generate icons
        run: python tools/make_icons.py

      - name: Download fonts (optional, build time only)
        continue-on-error: true
        run: ./tools/get-fonts.ps1

      - name: Fetch LGPL libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # Upstream keeps only about 30 days of builds, so look up the newest LGPL x86_64 package.
          $releases = gh api "repos/zhongfly/mpv-winbuild/releases?per_page=30" | ConvertFrom-Json
          $asset = $releases | ForEach-Object { $_.assets } |
            Where-Object { $_.name -match '^mpv-dev-lgpl-x86_64-\d' } | Select-Object -First 1
          if (-not $asset) { throw "No mpv-dev-lgpl-x86_64 asset found in zhongfly/mpv-winbuild releases." }
          Write-Host "Using $($asset.name)"
          New-Item -ItemType Directory -Force vendor, dist | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "libmpv.7z"
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          7z e -y "-ovendor" $archive libmpv-2.dll -r
          if (-not (Test-Path vendor\libmpv-2.dll)) { throw "libmpv-2.dll was not inside $($asset.name)" }
          # Diagnostic: newer libmpv builds can import vulkan-1.dll at load time.
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("vendor\libmpv-2.dll"))
          if ($text -imatch 'vulkan-1\.dll') {
            Write-Host "::warning::libmpv-2.dll references vulkan-1.dll. PCs without a Vulkan runtime may fail to load it."
          }

      - name: Build renderer
        run: cargo build --release -p livewall

      - name: Build settings window
        run: cargo build --release -p livewall-settings

      - name: Pack portable payload
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\stage | Out-Null
          Copy-Item target\release\livewall.exe, target\release\livewall-settings.exe, vendor\libmpv-2.dll, LICENSE, THIRD_PARTY.md dist\stage
          Compress-Archive -Path "dist\stage\*" -DestinationPath dist\payload.zip -Force

      - name: Build portable exe
        run: |
          cargo build --release -p livewall-portable
          Copy-Item target\release\livewall-portable.exe dist\LiveWallpaper-Portable.exe -Force

      - name: Build installer
        run: |
          $ErrorActionPreference = "Stop"
          function Find-Iscc {
            @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Find-Iscc }
          if (-not $iscc) { throw "Inno Setup could not be found or installed." }
          & $iscc installer\livewall.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper-windows
          path: |
            dist/LiveWallpaper-Setup.exe
            dist/LiveWallpaper-Portable.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LiveWallpaper-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
